[project]
name = "winter"
version = "1.3.1"
description = "Live network and system telemetry in the Windows taskbar."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "psutil>=7.2.2",
    "pydantic>=2.12.5",
    "pyside6>=6.11.1",
    "pyyaml>=6.0.3",
    "pywin32>=312",
]

[project.gui-scripts]
winter = "winter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winter"]

[dependency-groups]
dev = [
    "pyinstaller==6.21.0",
]
